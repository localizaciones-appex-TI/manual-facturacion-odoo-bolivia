site_name: Manual de facturación en Odoo
docs_dir: docs
site_dir: site
use_directory_urls: true

# Con --strict, un enlace roto o a un título inexistente detiene la construcción
validation:
  links:
    anchors: warn

theme:
  name: material
  language: es
  logo: assets/logo-appex.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: es
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
      auto_caption: false

copyright: >-
  &copy; 2026 Appex Bolivia SRL · Manual de usuario de facturación en Odoo

extra:
  generator: false
  social:
    - icon: material/web
      link: https://www.appexbo.com/
      name: Appex Bolivia

