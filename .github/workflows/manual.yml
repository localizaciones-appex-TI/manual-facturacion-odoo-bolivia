name: Manual de facturación

# Construye el sitio web del manual (MkDocs) cada vez que cambia algo en docs/.
# El sitio queda como artefacto descargable de la ejecución (privado, solo para
# quienes tienen acceso al repositorio).
# Publicar en GitHub Pages es opcional: requiere activar Pages (Settings → Pages →
# Source: GitHub Actions) y crear la variable de repositorio PUBLICAR_PAGES = true.
# Ojo: un sitio de GitHub Pages es público en internet.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/manual.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/manual.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar MkDocs
        run: pip install -r requirements-docs.txt

      - name: Construir el sitio
        run: mkdocs build --strict

      - name: Subir el sitio
        uses: actions/upload-artifact@v4
        with:
          name: manual-sitio
          path: site
          retention-days: 30

      - name: Preparar artefacto de Pages
        if: github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
